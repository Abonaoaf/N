<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط ومولد QR</title>
    <!-- مكتبة توليد الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef9f1;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .loading { font-size: 18px; color: #666; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h2>مختصر الروابط ومولد QR</h2>
    <p>أدخل الرابط الطويل للحصول على رابط مختصر ورمز QR</p>
    <input type="url" id="longUrl" placeholder="https://example.com/very-long-link..." required>
    <button onclick="generateShortLink()">توليد الرابط والـ QR</button>

    <div class="result" id="resultBox">
        <strong>الرابط المختصر:</strong>
        <p id="shortenedLink"></p>
        <button onclick="copyLink()" style="background-color: #0366d6;">نسخ الرابط</button>
        <div id="qrcode"></div>
    </div>
</div>

<script>
    // 1. نظام إعادة التوجيه التلقائي
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('to');

    if (targetUrl) {
        // تغيير واجهة الصفحة لتظهر للمستخدم أنه جاري الانتقال
        document.getElementById('main-container').innerHTML = '<div class="loading">جاري تحويلك للرابط المطلوب...</div>';
        // التحقق من وجود البروتوكول وإعادة التوجيه
        if (targetUrl.startsWith('http://') || targetUrl.startsWith('https://')) {
            window.location.href = targetUrl;
        } else {
            window.location.href = 'https://' + targetUrl;
        }
    }

    // 2. دالة توليد الرابط القصير والـ QR
    let qrcode = null;
    function generateShortLink() {
        const longUrl = document.getElementById('longUrl').value.trim();
        if (!longUrl) {
            alert('الرجاء إدخال رابط صحيح');
            return;
        }

        // الحصول على رابط موقعك الحالي على GitHub Pages
        const baseUrl = window.location.href.split('?')[0];
        
        // صناعة الرابط المختصر باستخدام المقصد (to)
        const shortUrl = `${baseUrl}?to=${encodeURIComponent(longUrl)}`;

        // عرض النتائج
        document.getElementById('shortenedLink').innerText = shortUrl;
        document.getElementById('resultBox').style.display = 'block';

        // توليد الـ QR Code
        document.getElementById('qrcode').innerHTML = '';
        qrcode = new QRCode(document.getElementById("qrcode"), {
            text: shortUrl,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    // دالة نسخ الرابط
    function copyLink() {
        const linkText = document.getElementById('shortenedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            alert('تم نسخ الرابط المختصر بنجاح!');
        });
    }
</script>

</body>
</html>
