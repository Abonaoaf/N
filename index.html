<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر روابط القدرات والـ QR الثابت</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary-blue: #0d47a1;
            --school-red: #ba0000;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }

        .container {
            background: white; padding: 2.5rem; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 90%; max-width: 400px; text-align: center;
        }

        input {
            width: 100%; padding: 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; margin-bottom: 20px; font-size: 1rem;
            text-align: left; direction: ltr; outline: none; box-sizing: border-box;
        }

        .btn {
            background: var(--primary-blue); color: white; border: none;
            padding: 14px; border-radius: 10px; cursor: pointer;
            width: 100%; font-weight: bold; font-size: 1rem; margin-bottom: 10px;
            transition: background 0.3s ease;
        }
        .btn:hover { background: #0a3c8c; }

        #resultArea { margin-top: 25px; display: none; }

        #qrcode { 
            display: flex; justify-content: center; margin: 20px 0;
        }
        #qrcode img {
            border: 1px solid #e2e8f0; padding: 8px; border-radius: 8px;
        }

        .short-url-text {
            margin: 15px 0; font-weight: bold; color: #2563eb; font-size: 1.1rem; word-break: break-all; direction: ltr; text-align: center;
        }

        .signature {
            margin-top: 25px; font-weight: bold; color: var(--school-red); font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مختصر روابط القدرات والـ QR الذكي 🔗</h2>
    <p style="color: #64748b; margin-bottom: 25px; font-size: 0.95rem;">ثانوية الأمير عبدالمجيد</p>

    <input type="text" id="modelName" placeholder="اكتب اسم ملف الموديل فقط (مثال: reading4)" required>
    <button class="btn" onclick="makeCleanShortAndQR()">اختصار وتوليد الرمز فوراً</button>

    <div id="resultArea">
        <div id="qrcode"></div>
        <div id="shortUrl" class="short-url-text"></div>
        
        <button class="btn" style="background:#10b981;" onclick="copyLink()">نسخ الرابط المختصر</button>
        <button class="btn" style="background:#4b5563;" onclick="downloadQR()">حفظ صورة الرمز</button>
    </div>

    <div class="signature">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    // الرابط الأساسي الثابت لمستودع ملفات اختباراتك
    const BASE_REPOSITORIES_URL = "https://school1school2-stack.github.io/ABO-TAIF/";

    // محرك التوجيه الفوري الآمن: بمجرد دخول الطالب يوجهه فوراً لرابط مستودع الأسئلة الحقيقي
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = urlParams.get('p');
        
        if (pageParam) {
            // تركيب الرابط الحقيقي للموديل فوراً والتحويل إليه دون أي وسيط
            const destinationUrl = `${BASE_REPOSITORIES_URL}${pageParam}.html`;
            window.location.replace(destinationUrl);
        }
    }

    function makeCleanShortAndQR() {
        let inputTarget = document.getElementById('modelName').value.trim();
        if (!inputTarget) return alert("فضلاً اكتب اسم الموديل أولاً");

        // تنظيف المدخلات لو قمت بلصق رابط كامل بالخطأ ليأخذ اسم الملف فقط
        if (inputTarget.includes("/")) {
            inputTarget = inputTarget.substring(inputTarget.lastIndexOf('/') + 1).replace(".html", "");
        }

        // إنشاء الرابط المختصر الحقيقي والنظيف الخاص بموقعك الحالي
        const currentBase = window.location.href.split('?')[0];
        const finalShortLink = `${currentBase}?p=${inputTarget}`;

        document.getElementById('shortUrl').innerText = finalShortLink;
        document.getElementById('resultArea').style.display = 'block';

        // رسم الـ QR Code محلياً وثبات كامل 100%
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        new QRCode(qrDiv, {
            text: finalShortLink,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('shortUrl').innerText);
        alert("تم نسخ الرابط المختصر بنجاح!");
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        if (img) {
            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'Majeed_School_QR.png';
            link.click();
        }
    }

    console.log("برمجة وحماية الملكية: أ/ عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد");
</script>

</body>
</html>
