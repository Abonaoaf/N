<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختصار الروابط وولد QR</title>
    <!-- مكتبة توليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .loading {
            font-size: 18px;
            color: #333;
            padding: 20px;
        }
        #resultBox {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        .secondary-btn {
            background-color: #008CBA;
            margin: 5px;
        }
        .secondary-btn:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>

<div class="card" id="main-container">
    <h2>اختصار الروابط و QR Code</h2>
    <input type="text" id="longUrl" placeholder="أدخل الرابط الطويل هنا...">
    <button id="genBtn">توليد رابط قصير جداً والـ QR</button>

    <div id="resultBox" style="display:none;">
        <div style="margin-bottom: 12px;">
            <span id="shortenedLink" style="font-weight: bold; direction: ltr; display: inline-block; word-break: break-all; color: #0066cc;"></span>
            <br>
            <button id="copyBtn" class="secondary-btn" style="margin-top: 8px;">نسخ الرابط</button>
        </div>
        <div id="qrcode"></div>
        <button id="idSaveQrBtn" class="secondary-btn">حفظ QR كصورة</button>
    </div>
</div>

<!-- Firebase SDKs (Modular) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // إعدادات الاتصال بـ Firebase الخاصة بك (قم باستبدالها ببيانات مشروعك الفعلية)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  // دالة لتوليد معرف عشوائي قصير
  function generateRandomId(length = 6) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
  }

  // 1. نظام التحويل التلقائي عند فتح الرابط المختصر
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  if (id) {
      document.getElementById('main-container').innerHTML = '<div class="loading">جاري قراءة الرابط من السحابة والتحويل...</div>';

      const dbRef = ref(database);
      get(child(dbRef, `short_urls/${id}`)).then((snapshot) => {
          if (snapshot.exists()) {
              let targetUrl = snapshot.val().longUrl;
              if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                  targetUrl = 'https://' + targetUrl;
              }
              window.location.href = targetUrl;
          } else {
              document.getElementById('main-container').innerHTML = '<div class="loading" style="color:red;">الرابط غير موجود أو منتهي الصلاحية!</div>';
          }
      }).catch(() => {
          document.getElementById('main-container').innerHTML = '<div class="loading" style="color:red;">خطأ في الاتصال بسحابة Firebase.</div>';
      });
  }

  // 2. دالة توليد الرابط وحفظه في فرع خاص بالسحابة
  document.getElementById('genBtn').addEventListener('click', () => {
      const longUrl = document.getElementById('longUrl').value.trim();
      if (!longUrl) {
          alert('الرجاء إدخال رابط أولاً');
          return;
      }

      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.innerText = "جاري التوصيل بالسحابة...";

      const shortId = generateRandomId();

      set(ref(database, 'short_urls/' + shortId), {
          longUrl: longUrl,
          createdAt: Date.now()
      })
      .then(() => {
          const baseUrl = window.location.origin + window.location.pathname;
          const shortUrl = `${baseUrl}?id=${shortId}`;

          document.getElementById('shortenedLink').innerText = shortUrl;
          document.getElementById('resultBox').style.display = 'block';

          // مسح الـ QR القديم وتوليد الجديد
          document.getElementById('qrcode').innerHTML = '';
          new QRCode(document.getElementById("qrcode"), {
              text: shortUrl,
              width: 160,
              height: 160
          });

          btn.disabled = false;
          btn.innerText = "توليد رابط قصير جداً والـ QR";
      })
      .catch((error) => {
          alert("فشل الحفظ في السحابة: " + error.message);
          btn.disabled = false;
          btn.innerText = "توليد رابط قصير جداً والـ QR";
      });
  });

  // 3. دالة نسخ الرابط للمستخدم
  document.getElementById('copyBtn').addEventListener('click', () => {
      const linkText = document.getElementById('shortenedLink').innerText;
      navigator.clipboard.writeText(linkText).then(() => {
          alert('تم نسخ الرابط بنجاح!');
      });
  });

  // 4. دالة حفظ الـ QR كصورة في الاستديو
  document.getElementById('idSaveQrBtn').addEventListener('click', () => {
      const qrContainer = document.getElementById('qrcode');
      const canvas = qrContainer.querySelector('canvas');
      const img = qrContainer.querySelector('img');

      let imageUrl = '';
      if (canvas) {
          imageUrl = canvas.toDataURL('image/png');
      } else if (img) {
          imageUrl = img.src;
      }

      if (imageUrl) {
          const link = document.createElement('a');
          link.href = imageUrl;
          link.download = 'qr-code.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      } else {
          alert('الرجاء توليد رمز الاستجابة السريعة أولاً.');
      }
  });
</script>

</body>
</html>
