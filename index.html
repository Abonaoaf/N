<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط والـ QR العام المستقر</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary-blue: #0d47a1;
            --school-red: #ba0000;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }

        .container {
            background: white; padding: 2.5rem; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 90%; max-width: 400px; text-align: center;
        }

        input {
            width: 100%; padding: 14px; border: 2px solid #e2e8f0;
            border-radius: 10px; margin-bottom: 20px; font-size: 1rem;
            text-align: left; direction: ltr; outline: none; box-sizing: border-box;
        }

        .btn {
            background: var(--primary-blue); color: white; border: none;
            padding: 14px; border-radius: 10px; cursor: pointer;
            width: 100%; font-weight: bold; font-size: 1rem; margin-bottom: 10px;
            transition: background 0.3s ease;
        }
        .btn:hover { background: #0a3c8c; }

        #resultArea { margin-top: 25px; display: none; }

        #qrcode { 
            display: flex; justify-content: center; margin: 20px 0;
        }
        #qrcode img {
            border: 1px solid #e2e8f0; padding: 8px; border-radius: 8px;
        }

        .short-url-text {
            margin: 15px 0; font-weight: bold; color: #2563eb; font-size: 1rem; word-break: break-all; direction: ltr; text-align: center;
        }

        .signature {
            margin-top: 25px; font-weight: bold; color: var(--school-red); font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مختصر الروابط والـ QR العام 🔗</h2>
    <p style="color: #64748b; margin-bottom: 25px; font-size: 0.95rem;">أداة الاختصار والـ QR المستقلة</p>

    <input type="url" id="longUrl" placeholder="ضع أي رابط في العالم هنا..." required>
    <button class="btn" onclick="generateUniversalShortUrl()">اختصار وتوليد الرمز فوراً</button>

    <div id="resultArea">
        <div id="qrcode"></div>
        <div id="shortUrl" class="short-url-text"></div>
        
        <button class="btn" style="background:#10b981;" onclick="copyLink()">نسخ الرابط المختصر</button>
        <button class="btn" style="background:#4b5563;" onclick="downloadQR()">حفظ صورة الرمز</button>
    </div>

    <div class="signature">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    // محرك التوجيه الفوري العام: يشتغل عند فتح الرابط من أي مكان في العالم ليفك الشفرة ويوجه فوراً
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetParam = urlParams.get('url');
        
        if (targetParam) {
            try {
                // استرجاع الرابط الأصلي المكبوس وفك تشفيره بأمان
                let cleanBase64 = targetParam.replace(/-/g, '+').replace(/_/g, '/');
                while (cleanBase64.length % 4) { cleanBase64 += '='; }
                const decodedUrl = decodeURIComponent(escape(atob(cleanBase64)));
                
                if (decodedUrl.startsWith('http://') || decodedUrl.startsWith('https://')) {
                    window.location.replace(decodedUrl);
                }
            } catch (e) {
                alert("عذراً، الرابط المختصر غير صحيح أو تالف.");
            }
        }
    }

    function generateUniversalShortUrl() {
        const urlInput = document.getElementById('longUrl').value.trim();
        if (!urlInput) return alert("فضلاً ضع الرابط أولاً");
        if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
            return alert("تأكد من أن الرابط يبدأ بـ http:// أو https://");
        }

        try {
            // كبس وتشفير الرابط بالكامل محلياً
            let base64 = btoa(encodeURIComponent(urlInput));
            // تنظيف النص تماماً من الرموز (مثل / و + و =) التي تسبب خطأ 404 في المتصفحات
            let safeBase64 = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            const currentBase = window.location.href.split('?')[0];
            // رابط قصير، نظيف ومحمي تماماً
            const finalShortLink = `${currentBase}?url=${safeBase64}`;

            document.getElementById('shortUrl').innerText = finalShortLink;
            document.getElementById('resultArea').style.display = 'block';

            // رسم الـ QR كلاسيكياً فوراً وبثبات 100%
            const qrDiv = document.getElementById("qrcode");
            qrDiv.innerHTML = "";
            new QRCode(qrDiv, {
                text: finalShortLink,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

        } catch (e) {
            alert("حدث خطأ أثناء الاختصار الفوري.");
        }
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('shortUrl').innerText);
        alert("تم نسخ الرابط المختصر بنجاح!");
    }

    function downloadQR() {
        const img = document.querySelector('#qrcode img');
        if (img) {
            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'Universal_QR.png';
            link.click();
        }
    }

    console.log("الملكية الفكرية: أ/ عبدالعزيز الفيفي");
</script>

</body>
</html>
