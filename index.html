<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط ومولد QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        .result {
            margin-top: 15px;
            padding: 12px;
            background: #eef9f1;
            border-radius: 6px;
            display: none;
        }
        #shortenedLink {
            background: #fff;
            padding: 8px;
            border: 1px dashed #2ea44f;
            border-radius: 4px;
            word-break: break-all;
            font-size: 14px;
            margin: 5px 0;
            color: #0366d6;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .loading { font-size: 18px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h2>مختصر الروابط ومولد QR</h2>
    <p style="color:#666; font-size:14px;">أدخل الرابط للحصول على رابط أقصر ورمز QR</p>
    <input type="url" id="longUrl" placeholder="ضع الرابط هنا..." required>
    <button onclick="generateShortLink()">توليد الرابط والـ QR</button>

    <div class="result" id="resultBox">
        <strong style="font-size:14px;">الرابط المختصر النظيف:</strong>
        <div id="shortenedLink"></div>
        <button onclick="copyLink()" style="background-color: #0366d6; padding: 8px; font-size: 14px;">نسخ الرابط</button>
        <div id="qrcode"></div>
    </div>
</div>

<script>
    // 1. نظام التحويل التلقائي الذكي والـ فك التشفير
    const urlParams = new URLSearchParams(window.location.search);
    let targetUrl = urlParams.get('to');

    if (targetUrl) {
        document.getElementById('main-container').innerHTML = '<div class="loading">جاري تحويلك تلقائياً...</div>';
        
        // فك تشفير الرابط ليعود لطبيعته
        try {
            targetUrl = decodeURIComponent(targetUrl);
        } catch(e) { }

        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            targetUrl = 'https://' + targetUrl;
        }
        window.location.href = targetUrl;
    }

    // 2. توليد الرابط بشكل أقصر ومباشر بدون تشفير مزدوج
    let qrcode = null;
    function generateShortLink() {
        let longUrl = document.getElementById('longUrl').value.trim();
        if (!longUrl) {
            alert('الرجاء إدخال رابط أولاً');
            return;
        }

        const baseUrl = window.location.origin + window.location.pathname;
        
        // بناء الرابط بأقل قدر ممكن من الرموز الزائدة
        const shortUrl = `${baseUrl}?to=${encodeURIComponent(longUrl)}`;

        document.getElementById('shortenedLink').innerText = shortUrl;
        document.getElementById('resultBox').style.display = 'block';

        // توليد الـ QR Code للرابط الجديد
        document.getElementById('qrcode').innerHTML = '';
        qrcode = new QRCode(document.getElementById("qrcode"), {
            text: shortUrl,
            width: 160,
            height: 160,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M // مستوى متوسط لتقليل تعقيد المربعات في الـ QR
        });
    }

    function copyLink() {
        const linkText = document.getElementById('shortenedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            alert('تم نسخ الرابط بنجاح!');
        });
    }
</script>

</body>
</html>
