<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات الاشتراك ومتجر التطبيقات </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box; 
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            background-color: #2ea44f; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { background-color: #2c974b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result { margin-top: 15px; padding: 12px; background: #eef9f1; border-radius: 6px; display: none; }
        #shortenedLink { 
            background: #fff; 
            padding: 8px; 
            border: 1px dashed #2ea44f; 
            border-radius: 4px; 
            word-break: break-all; 
            font-size: 16px; 
            margin: 5px 0; 
            color: #0366d6; 
            font-weight: bold; 
            direction: ltr;
        }
        #qrcode { display: flex; justify-content: center; margin-top: 15px; }
        .loading { font-size: 18px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h2>بيانات اشتراكك ومتجر التطبيقات</h2>
    <p style="color:#666; font-size:14px;">أدخل رابط المتجر أو بيانات الاشتراك لتوليد رابط فائق القصر ورمز QR واضح للعملاء</p>
    <input type="url" id="longUrl" placeholder="ضع رابط المتجر أو رابط الاشتراك هنا..." required>
    <button id="genBtn">توليد الرابط المختصر والـ QR</button>

    <div class="result" id="resultBox">
        <strong style="font-size:14px;">الرابط المختصر والنظيف للعميل:</strong>
        <div id="shortenedLink"></div>
        <button id="copyBtn" style="background-color: #0366d6; padding: 8px; font-size: 14px;">نسخ الرابط لإرساله للعميل</button>
        <div id="qrcode"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات سحابة Firebase (youy-apps)
    const firebaseConfig = {
        apiKey: "AIzaSyAVrIim7aXjg0hGrMk0qVrXT8gaRIpHoBk",
        authDomain: "youy-apps.firebaseapp.com",
        databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
        projectId: "youy-apps",
        storageBucket: "youy-apps.firebasestorage.app",
        messagingSenderId: "690543747528",
        appId: "1:690543747528:web:10c85ef0c93b79596620fd",
        measurementId: "G-LL8PGM8G8E"
    };

    // تهيئة السحابة
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // توليد معرف عشوائي فريد من 4 حروف فقط لتقصير الرابط لأقصى درجة
    function generateRandomId() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < 4; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // 1. قراءة المسار الذكي وفك تشفير الرابط المختصر تلقائياً عند فتحه من قبل العميل
    const path = window.location.pathname;
    const segments = path.split('/').filter(Boolean);
    let id = null;

    if (segments.length > 0) {
        const lastSegment = segments[segments.length - 1];
        if (lastSegment !== 'N') {
            id = lastSegment;
        }
    }

    // نظام فحص احتياطي عبر المعرف القديم ?id=
    if (!id) {
        const urlParams = new URLSearchParams(window.location.search);
        id = urlParams.get('id');
    }

    // تحويل العميل فوراً إلى متجر التطبيقات أو صفحة الاشتراك الخاصة به
    if (id) {
        document.getElementById('main-container').innerHTML = '<div class="loading">جاري الانتقال إلى متجر التطبيقات وبيانات الاشتراك...</div>';
        
        const dbRef = ref(database);
        get(child(dbRef, `short_urls/${id}`)).then((snapshot) => {
            if (snapshot.exists()) {
                let targetUrl = snapshot.val().longUrl;
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }
                window.location.href = targetUrl;
            } else {
                document.getElementById('main-container').innerHTML = '<div class="loading" style="color:red;">عذراً، رابط الاشتراك هذا غير مسجل أو انتهت صلاحيته!</div>';
            }
        }).catch(() => {
            document.getElementById('main-container').innerHTML = '<div class="loading" style="color:red;">خطأ في الاتصال بالسحابة الآمنة.</div>';
        });
    }

    // 2. دالة إرسال الرابط السحابي وتوليد الرابط القصير
    document.getElementById('genBtn').addEventListener('click', () => {
        const longUrl = document.getElementById('longUrl').value.trim();
        if (!longUrl) {
            alert('الرجاء كتابة أو لصق الرابط أولاً');
            return;
        }

        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.innerText = "جاري الحفظ والتهيئة سحابياً...";

        const shortId = generateRandomId();

        // التخزين السحابي الآمن في قاعدة البيانات
        set(ref(database, 'short_urls/' + shortId), {
            longUrl: longUrl,
            createdAt: Date.now()
        })
        .then(() => {
            const baseUrl = window.location.origin + window.location.pathname;
            const cleanBaseUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
            const shortUrl = `${cleanBaseUrl}${shortId}`;

            document.getElementById('shortenedLink').innerText = shortUrl;
            document.getElementById('resultBox').style.display = 'block';

            // مسح الـ QR القديم ورسم الجديد بدقة عالية للرابط الصغير لسهولة المسح بالكاميرا
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById("qrcode"), {
                text: shortUrl,
                width: 170,
                height: 170,
                correctLevel : QRCode.CorrectLevel.M
            });

            btn.disabled = false;
            btn.innerText = "توليد الرابط المختصر والـ QR";
        })
        .catch((error) => {
            alert("حدث خطأ أثناء الاتصال بالسحابة: " + error.message);
            btn.disabled = false;
            btn.innerText = "توليد الرابط المختصر والـ QR";
        });
    });

    // دالة النسخ السريع بلمسة واحدة لسهولة المشاركة مع العميل
    document.getElementById('copyBtn').addEventListener('click', () => {
        const linkText = document.getElementById('shortenedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            alert('تم نسخ رابط الاشتراك بنجاح!');
        });
    });
</script>

</body>
</html>
